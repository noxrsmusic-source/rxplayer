<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Downloading RX Player APP...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background: #08080C; color: #fff; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; padding: 30px 16px 60px; text-align: center;
            overflow-x: hidden;
        }

        /* 🎬 Cinematic Background */
        .bg-wrapper {
            position: fixed; inset: 0; display: flex; justify-content: center; gap: 12px;
            opacity: 0.1; z-index: 0; pointer-events: none; overflow: hidden;
        }
        .scroll-column { display: flex; flex-direction: column; gap: 12px; width: 30%; will-change: transform; }
        @media (min-width: 768px) { .scroll-column { width: 15%; } }
        @keyframes scrollUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(calc(-50% - 6px)); }
        }
        .col-1 { animation: scrollUp 40s linear infinite; }
        .col-2 { animation: scrollUp 50s linear infinite; }
        .col-3 { animation: scrollUp 45s linear infinite; }
        .poster-card { border-radius: 12px; overflow: hidden; aspect-ratio: 2 / 3; background: #1c1c1e; flex-shrink: 0; }
        .poster-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .content-box {
            background: rgba(20, 20, 31, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
            padding: 24px; max-width: 420px; width: 100%;
            box-shadow: 0 16px 40px rgba(0,0,0,0.8); position: relative; z-index: 10;
        }

        .lang-toggle {
            position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 10px;
            border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer;
            transition: 0.3s; z-index: 10;
        }
        .lang-toggle:hover { background: #E50914; border-color: #E50914; }

        .official-badge {
            display: inline-block; background: rgba(229, 9, 20, 0.15); color: #ff4d5e;
            border: 1px solid rgba(229, 9, 20, 0.3); padding: 4px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 800; margin-bottom: 20px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .content-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }

        /* Left Column: App Info */
        .media-info { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .app-icon-wrap {
            width: 100px; height: 100px; margin: 0 auto 14px; border-radius: 22px;
            overflow: hidden; box-shadow: 0 10px 30px rgba(229, 9, 20, 0.3);
            background: #0a0a0f; border: 1px solid rgba(255,255,255,0.15);
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .app-icon-wrap img { width: 100%; height: 100%; object-fit: cover; }
        
        h1 { font-size: 20px; font-weight: 800; margin-bottom: 6px; color: #fff; line-height: 1.3; }
        p.subtitle { font-size: 13px; color: #9CA3AF; margin-bottom: 0; font-weight: 600; }

        /* Right Column: Action Area */
        .action-area { 
            display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; 
        }

        /* ✅ TIMER */
        .timer-text {
            width: 100%; max-width: 350px; 
            font-size: 16px; font-weight: 800; color: #ff4d5e; display: block;
            padding: 15px; background: #1a080a; 
            border-radius: 8px;
            border: 1px solid #E50914;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            position: relative;
            z-index: 99999;
            text-align: center; margin-bottom: 20px;
        }

        /* ✅ AD PLACEHOLDER */
        .ad-placeholder {
            width: 100%; min-height: 250px; 
            background: rgba(255,255,255,0.02);
            border: 1px dashed rgba(255,255,255,0.15); 
            border-radius: 8px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-bottom: 10px; padding: 20px;
            overflow: hidden; position: relative; gap: 15px;
        }

        .ad-label {
            position: absolute; top: 10px; left: 10px; font-size: 10px;
            color: #9CA3AF; text-transform: uppercase; letter-spacing: 1px;
            font-weight: 700;
        }

        .telegram-banner {
            background: linear-gradient(135deg, #0088cc 0%, #005f8c 100%);
            color: #fff; padding: 15px 25px; border-radius: 50px;
            font-weight: 800; font-size: 15px; text-decoration: none;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            width: 90%; max-width: 300px; z-index: 2;
        }
        .telegram-banner:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 10px 25px rgba(0, 136, 204, 0.6); }
        .telegram-banner i { font-size: 22px; }

        .fake-skip-btn {
            position: absolute; bottom: 12px; right: 12px;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; padding: 8px 16px; border-radius: 20px;
            font-size: 12px; font-weight: 700; text-decoration: none;
            display: flex; align-items: center; gap: 6px; transition: 0.3s;
            backdrop-filter: blur(5px); z-index: 2;
        }
        .fake-skip-btn:hover { background: rgba(229, 9, 20, 0.9); border-color: #E50914; transform: scale(1.05); }

        @media (min-width: 768px) {
            body { padding-top: 45px; padding-bottom: 60px; }
            .content-box { max-width: 800px; padding: 40px; }
            .content-grid { grid-template-columns: 250px 1fr; gap: 40px; align-items: center; text-align: left; }
            .media-info { align-items: flex-start; }
            .app-icon-wrap { width: 140px; height: 140px; margin: 0 0 20px 0; }
            h1 { font-size: 26px; margin-bottom: 8px; }
            p.subtitle { font-size: 15px; }
            .ad-placeholder { min-height: 250px; margin-bottom: 0; }
            .timer-text { font-size: 18px; padding: 18px; margin-bottom: 20px; max-width: 400px; }
        }
    </style>
</head>
<body>

    <!-- 🎬 Cinematic Background -->
    <div class="bg-wrapper">
        <div class="scroll-column col-1">
            <div class="poster-card"><img src="https://m.media-amazon.com/images/M/MV5BMTk2ZmFhYjctYWZiYy00N2IxLWEzMWItZGRiMDY4ZDQwZWFlXkEyXkFqcGc@._V1_QL75_UY281_CR11,0,190,281_.jpg" alt="Poster"></div>
            <div class="poster-card"><img src="https://m.media-amazon.com/images/M/MV5BMjEzMDAxOTUyMV5BMl5BanBnXkFtZTgwNzAxMzYzOTE@._V1_QL75_UX190_CR0,0,190,281_.jpg" alt="Poster"></div>
            <div class="poster-card"><img src="https://m.media-amazon.com/images/M/MV5BOWNjYWM3NWItOGE0ZS00MWRjLThiZWEtYjc4ZmNmMmU5ZTVmXkEyXkFqcGc@._V1_QL75_UX190_CR0,0,190,281_.jpg" alt="Poster"></div>
        </div>
        <div class="scroll-column col-2">
            <div class="poster-card"><img src="https://m.media-amazon.com/images/M/MV5BMGUzOWE4NDItNzAxYy00M2VkLWFiNDEtNjczZTQ2Nzg5YmVhXkEyXkFqcGc@._V1_QL75_UY281_CR18,0,190,281_.jpg" alt="Poster"></div>
            <div class="poster-card"><img src="https://m.media-amazon.com/images/M/MV5BYmEzYTQ2OTEtMGM4MS00MWE1LWI3MGYtMTIyN2IwYzlkYmI0XkEyXkFqcGc@._V1_QL75_UY281_CR18,0,190,281_.jpg" alt="Poster"></div>
            <div class="poster-card"><img src="https://m.media-amazon.com/images/M/MV5BMjEzMDAxOTUyMV5BMl5BanBnXkFtZTgwNzAxMzYzOTE@._V1_QL75_UX190_CR0,0,190,281_.jpg" alt="Poster"></div>
        </div>
        <div class="scroll-column col-3">
            <div class="poster-card"><img src="https://m.media-amazon.com/images/M/MV5BMWU1OGEwNmQtNGM3MS00YTYyLThmYmMtN2FjYzQzNzNmNTE0XkEyXkFqcGc@._V1_QL75_UX190_CR0,2,190,281_.jpg" alt="Poster"></div>
            <div class="poster-card"><img src="https://m.media-amazon.com/images/M/MV5BZTNjOWI0ZTAtOGY1OS00ZGU0LWEyOWYtMjhkYjdlYmVjMDk2XkEyXkFqcGc@._V1_QL75_UY281_CR1,0,190,281_.jpg" alt="Poster"></div>
            <div class="poster-card"><img src="https://m.media-amazon.com/images/M/MV5BOWNjYWM3NWItOGE0ZS00MWRjLThiZWEtYjc4ZmNmMmU5ZTVmXkEyXkFqcGc@._V1_QL75_UX190_CR0,0,190,281_.jpg" alt="Poster"></div>
        </div>
    </div>

    <div class="content-box">
        <button id="lang-toggle" class="lang-toggle">हिंदी</button>
        <div class="official-badge">Official App Download</div>

        <div class="content-grid">
            <!-- Left Column: App Info -->
            <div class="media-info">
                <div class="app-icon-wrap">
                    <img src="https://res.cloudinary.com/du9nysbwl/image/upload/v1788457070/rxplayerlogo_ppyvfr.jpg" alt="RX Player App">
                </div>
                <h1>RX Player APP</h1>
                <p class="subtitle">v1.1.0 • Android 6.0+</p>
            </div>

            <!-- Right Column: Action Area -->
            <div class="action-area">
                
                <!-- TIMER -->
                <div id="timer-text" class="timer-text">
                    <i class="fas fa-clock"></i> <span id="timer-message">Please wait... Auto-redirecting in 20 seconds</span>
                </div>

                <!-- ✅ BANNER AD CONTAINER -->
                <div class="ad-placeholder">
                    <span class="ad-label">Advertisement</span>

                    <!-- Telegram Banner Link -->
                    <a href="https://t.me/rxplayer" target="_blank" class="telegram-banner">
                        <i class="fab fa-telegram-plane"></i> Join our Telegram
                    </a>

                    <!-- Fake Skip Ad Button -->
                    <a href="https://uplcm.com/4/12062803" target="_blank" class="fake-skip-btn">
                        Skip Ad <i class="fas fa-times"></i>
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Translation Data
        let currentLang = 'en';
        const translations = {
            en: {
                timer_msg: "Wait {time}s, Auto-redirecting to Download..."
            },
            hi: {
                timer_msg: "प्रतीक्षा करें... {time} सेकंड में डाउनलोड पेज खुल रहा है"
            }
        };

        const timerMessage = document.getElementById('timer-message');
        const langToggle = document.getElementById('lang-toggle');
        let countdownInterval;
        let timeLeft = 20;

        function updateTimerText() {
            const template = translations[currentLang].timer_msg;
            timerMessage.textContent = template.replace('{time}', timeLeft);
        }

        // Language Toggle Logic
        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            langToggle.textContent = currentLang === 'en' ? 'हिंदी' : 'English';
            updateTimerText();
        });

        // Timer Logic
        function startTimer() {
            updateTimerText();
            countdownInterval = setInterval(() => {
                timeLeft--;
                updateTimerText();
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    redirectUser();
                }
            }, 1000);
        }

        // 🚀 Redirect to Download Page
        function redirectUser() {
            window.location.href = 'download.html';
        }

        // Start Timer on page load
        startTimer();
    </script>

    <!-- Include your anti-adblock script if needed -->
    <script src="anti-adblock.js"></script>

</body>
</html>
