            0% { transform: translateY(0); }

            text-transform: uppercase; letter-spacing: 0.5px;

        .content-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }

        /* Left Column: App Info */

            background: #0a0a0f; border: 1px solid rgba(255,255,255,0.15);
            animation: float 4s ease-in-out infinite;

            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }

        .app-icon-wrap img { width: 100%; height: 100%; object-fit: cover; }

        p.subtitle { font-size: 13px; color: #9CA3AF; margin-bottom: 0; font-weight: 600; }

        /* Right Column: Action Area */
        .action-area { 
            display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; 
        }

        /* ✅ TIMER */

            padding: 15px; background: #1a080a;

            border: 1px solid #E50914;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            position: relative;
            z-index: 99999;
            text-align: center; margin-bottom: 20px;
        }

        /* ✅ AD PLACEHOLDER */

            width: 100%; min-height: 250px; 
            background: rgba(255,255,255,0.02);
            border: 1px dashed rgba(255,255,255,0.15); 
            border-radius: 8px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-bottom: 10px; padding: 20px;
            overflow: hidden; position: relative; gap: 15px;
        }

        .ad-label {
            position: absolute; top: 10px; left: 10px; font-size: 10px;
            color: #9CA3AF; text-transform: uppercase; letter-spacing: 1px;
            font-weight: 700;
        }

        .telegram-banner {
            background: linear-gradient(135deg, #0088cc 0%, #005f8c 100%);

            .ad-placeholder { min-height: 250px; margin-bottom: 0; }

        async function isBraveBrowser() {
            try {
                if (navigator.brave && typeof navigator.brave.isBrave === 'function') {
                    if (await navigator.brave.isBrave()) return true;
                }
            } catch (e) {}
            try {
                if (navigator.userAgentData && navigator.userAgentData.brands) {
                    return navigator.userAgentData.brands.some(b => b.brand === 'Brave');
                }
            } catch (e) {}
            return false;
        }

        function checkNetworkBlocks() {
            return new Promise((resolve) => {
                let blockedSignals = 0;
                let completed = 0;
                const totalTests = 2;

                const finish = () => {
                    completed++;
                    if (completed >= totalTests) resolve(blockedSignals > 0);
                };

                const script = document.createElement('script');
                script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?cb=' + Math.random();
                script.async = true;
                script.onload = () => finish();
                script.onerror = () => { blockedSignals++; finish(); };
                document.head.appendChild(script);
                setTimeout(() => { script.remove(); }, CHECK_TIMEOUT);

                const img = new Image();
                img.src = 'https://googleads.g.doubleclick.net/pagead/viewthroughconversion/123456789/?cb=' + Math.random();
                img.onload = () => finish();
                img.onerror = () => { blockedSignals++; finish(); };
                
                setTimeout(() => { if (completed < totalTests) { blockedSignals++; resolve(true); } }, CHECK_TIMEOUT);
            });
        }

        function checkDomBait() {
            const bait = document.createElement('div');
            bait.className = 'adsbox ad-banner ad-unit';
            bait.style.cssText = 'position:absolute!important;left:-10000px!important;top:-10000px!important;width:10px!important;height:10px!important;';
            document.body.appendChild(bait);
            const blocked = bait.offsetWidth === 0 || bait.offsetHeight === 0 || getComputedStyle(bait).display === 'none';
            bait.remove();
            return blocked;
        }

        async function detectAdBlock() {
            const brave = await isBraveBrowser();
            const networkBlocked = await checkNetworkBlocks();
            const domBlocked = checkDomBait();

            if (brave && networkBlocked) return true;
            if (domBlocked || networkBlocked) return true;
            return false;

                .poster-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
                .overlay-gradient { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15, 15, 15, 0.6) 0%, rgba(15, 15, 15, 0.9) 45%, #0f0f0f 100%); z-index: 2; pointer-events: none; }
                .box { position: relative; z-index: 10; max-width: 480px; background: rgba(28, 28, 31, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 40px 30px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
                @keyframes popIn { 0% { opacity: 0; transform: scale(0.9) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
                h2 { margin: 0 0 16px; font-size: 24px; color: #fff; font-weight: 700;}
                p { margin: 0 0 24px; line-height: 1.6; font-size: 16px; color: #b3b3b3; }
                button.main-btn { background: #e50914; color: #fff; border: 0; border-radius: 8px; padding: 14px 24px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; max-width: 320px; }
                button.main-btn:disabled { opacity: 0.6; cursor: wait; }
                .top-controls { position: absolute; top: 12px; left: 16px; right: 16px; display: flex; justify-content: flex-end; }
                .ctrl-btn { background: transparent; border: 1px solid #444; color: #aaa; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
                .hint { color: #777; font-size: 13px; margin-top: 24px; line-height: 1.5; }
                .hint b { color: #aaa; }
            </style>
            <div class="wrap">
                <div class="overlay-bg-wrapper" id="overlay-bg-wrapper"></div>
                <div class="overlay-gradient"></div>
                <div class="box">
                    <div class="top-controls"><button class="ctrl-btn" id="lang-toggle-ad">${translations_adblock[currentLang_adblock].toggleLabel}</button></div>
                    <h2 id="ad-title" style="margin-top: 10px;">${translations_adblock[currentLang_adblock].title}</h2>
                    <p id="ad-body">${translations_adblock[currentLang_adblock].body}</p>
                    <button class="main-btn" id="adblock-retry">${translations_adblock[currentLang_adblock].btnCheck}</button>
                    <p class="hint" id="ad-hint">${translations_adblock[currentLang_adblock].hint1}<br>${translations_adblock[currentLang_adblock].hint2}</p>
                </div>
            </div>`;
            document.documentElement.appendChild(overlayHost);

            const bgWrapper = shadowRoot.getElementById('overlay-bg-wrapper');
            function createPosterHTML(url) { return `<div class="poster-card"><img src="${url}" alt="Poster"></div>`; }
            function buildColumn(arr) { let html = ''; for(let i=0; i<5; i++) { arr.forEach(url => html += createPosterHTML(url)); } return html; }
            if(bgWrapper) {
                for(let i=0; i<6; i++) {
                    const col = document.createElement('div');
                    const speeds = ['fast', 'slow', 'medium'];
                    const arrays = [posters1, posters2, posters3];
                    col.className = `scroll-column scroll-column-up-${speeds[i % 3]}`;
                    col.innerHTML = buildColumn(arrays[i % 3]);
                    bgWrapper.appendChild(col);
                }
            }

            observer = new MutationObserver(() => { if (!document.getElementById(OVERLAY_ID) && overlayHost) document.documentElement.appendChild(overlayHost); });
            observer.observe(document.documentElement, { childList: true, subtree: true });
            reAddInterval = setInterval(() => { if (!document.getElementById(OVERLAY_ID) && overlayHost) document.documentElement.appendChild(overlayHost); }, 300);

            const retryBtn = shadowRoot.getElementById('adblock-retry');
            const langToggleBtn = shadowRoot.getElementById('lang-toggle-ad');
            const titleEl = shadowRoot.getElementById('ad-title');
            const bodyEl = shadowRoot.getElementById('ad-body');
            const hintEl = shadowRoot.getElementById('ad-hint');

            // Play Music (Since user already clicked Continue, this will work instantly)
            if (bgAudio) {
                bgAudio.play().catch(e => console.log("Play failed:", e));
            }

            langToggleBtn.addEventListener('click', () => {
                currentLang_adblock = currentLang_adblock === 'en' ? 'hi' : 'en';
                localStorage.setItem('adblock_lang', currentLang_adblock);
                titleEl.innerHTML = translations_adblock[currentLang_adblock].title;
                bodyEl.innerHTML = translations_adblock[currentLang_adblock].body;
                hintEl.innerHTML = `${translations_adblock[currentLang_adblock].hint1}<br>${translations_adblock[currentLang_adblock].hint2}`;
                langToggleBtn.textContent = translations_adblock[currentLang_adblock].toggleLabel;
                if (!retryBtn.disabled) retryBtn.textContent = translations_adblock[currentLang_adblock].btnCheck;
            });

            retryBtn.addEventListener('click', async () => {
                retryBtn.disabled = true;
                retryBtn.textContent = translations_adblock[currentLang_adblock].btnWait;

                setTimeout(async () => {
                    const isBlocked = await detectAdBlock();
                    if (isBlocked) {
                        retryBtn.disabled = false;
                        retryBtn.textContent = translations_adblock[currentLang_adblock].btnStillBlocked;
                    } else {
                        // SUCCESS! Adblock is off.
                        observer.disconnect();
                        clearInterval(reAddInterval);
                        if (bgAudio) bgAudio.pause(); 
                        overlayHost.remove();
                        overlayHost = null;
                        
                        // Ab timer start karo
                        startMainTimer();
                    }
                }, 800);
            });
        }

        // Initial Check
        async function runInitialCheck() {
            if (detectionRunning) return;
            detectionRunning = true;
            try {
                await new Promise(r => setTimeout(r, 1000)); // Wait for Brave to apply rules
                adBlockDetected = await detectAdBlock();
                if (adBlockDetected) {
                    showContinueButton();
                } else {
                    // No adblock, start timer directly
                    startMainTimer();
                }
            } catch (e) {
                console.warn("Detection error:", e);
                startMainTimer(); // Fallback
            } finally {
                detectionRunning = false;
            }
        }

        /* ============================================================
           2. MAIN TIMER LOGIC
           ============================================================ */
        const timerMessage = document.getElementById('timer-message');
        const langToggle = document.getElementById('lang-toggle');
        let countdownInterval;
        let timeLeft = 20;

        const translations = {
            en: { timer_msg: "Wait {time}s, Auto-redirecting to Download..." },
            hi: { timer_msg: "प्रतीक्षा करें... {time} सेकंड में डाउनलोड पेज खुल रहा है" }
        };
        let currentLang = 'en';

        function updateTimerText() {
            const template = translations[currentLang].timer_msg;
            timerMessage.textContent = template.replace('{time}', timeLeft);
        }

        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            langToggle.textContent = currentLang === 'en' ? 'हिंदी' : 'English';
            updateTimerText();
        });

        function startMainTimer() {
            updateTimerText();
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                timeLeft--;
                updateTimerText();
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    redirectUser();
                }
            }, 1000);
        }

        function redirectUser() {
            window.location.href = 'download.html';
        }

        // Start everything
        runInitialCheck();

    })();
    </script>

</body>
</html>
