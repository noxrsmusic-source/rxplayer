<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RX Player App - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background: #08080C; color: #fff; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 30px 16px; text-align: center;
            overflow: hidden;
        }

        /* =========================================================
           MAIN AD VIEW (Shows initially)
           ========================================================= */
        .content-box {
            background: #14141F; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
            padding: 24px; max-width: 420px; width: 100%;
            box-shadow: 0 16px 40px rgba(0,0,0,0.8); position: relative;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .lang-toggle {
            position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 10px;
            border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer;
            transition: 0.3s; z-index: 10;
        }
        .lang-toggle:hover { background: #E50914; border-color: #E50914; }

        .official-badge {
            display: inline-block; background: rgba(229, 9, 20, 0.15); color: #ff4d5e;
            border: 1px solid rgba(229, 9, 20, 0.3); padding: 4px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 800; margin-bottom: 20px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .content-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }

        .media-info { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* App Logo */
        .app-logo-wrap {
            width: 100px; height: 100px; margin: 0 auto 14px; border-radius: 22px;
            overflow: hidden; box-shadow: 0 8px 24px rgba(229,9,20,0.3); background: #0a0a0f;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .app-logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
        
        h1 { font-size: 22px; font-weight: 900; margin-bottom: 6px; color: #fff; line-height: 1.3; letter-spacing: -0.5px; }
        p.subtitle { font-size: 13px; color: #9CA3AF; margin-bottom: 0; }

        .action-area { 
            display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; 
        }

        /* TIMER */
        .timer-text {
            width: 100%; max-width: 350px; 
            font-size: 16px; font-weight: 800; color: #ff4d5e; display: block;
            padding: 15px; background: #1a080a; 
            border-radius: 8px;
            border: 1px solid #E50914;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            position: relative;
            z-index: 99999;
            text-align: center; margin-bottom: 20px;
        }

        /* VIDEO PLAYER */
        .video-player {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 16 / 9;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 14px 34px rgba(0,0,0,0.8), 0 0 0 1px rgba(229, 9, 20, 0.3);
            margin-bottom: 10px;
        }
        .video-player iframe {
            width: 100%; height: 100%; border: 0; display: block;
        }

        /* =========================================================
           UNDER CONSTRUCTION VIEW (Shows after timer)
           ========================================================= */
        .construction-view {
            display: none; /* Hidden initially */
            background: #14141F; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
            padding: 40px 24px; max-width: 420px; width: 100%;
            box-shadow: 0 16px 40px rgba(0,0,0,0.8), inset 0 0 50px rgba(229,9,20,0.1);
            position: relative; text-align: center;
            opacity: 0; transform: scale(0.9); transition: all 0.5s cubic-bezier(0.4,0,0.2,1);
            border-top: 4px solid #E50914;
        }

        .construction-view.show {
            display: block;
            opacity: 1; transform: scale(1);
        }

        .construction-icon {
            font-size: 60px; color: #E50914; margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(229,9,20,0.4));
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .construction-view h2 {
            font-size: 26px; font-weight: 900; color: #fff; margin-bottom: 10px; letter-spacing: -0.5px;
        }
        .construction-view p {
            font-size: 14px; color: #9CA3AF; line-height: 1.6; margin-bottom: 24px;
        }

        .notify-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: #E50914; color: #fff; padding: 14px 24px; border-radius: 30px;
            font-size: 15px; font-weight: 700; border: none; cursor: pointer; text-decoration: none;
            box-shadow: 0 8px 24px rgba(229,9,20,0.4); transition: 0.3s;
            width: 100%;
        }
        .notify-btn:hover { background: #b20710; transform: translateY(-2px); box-shadow: 0 12px 30px rgba(229,9,20,0.6); }

        @media (min-width: 768px) {
            .content-box { max-width: 900px; padding: 40px; }
            .content-grid { grid-template-columns: 280px 1fr; gap: 40px; align-items: center; text-align: left; }
            .media-info { align-items: flex-start; }
            .app-logo-wrap { margin: 0 0 20px 0; width: 140px; height: 140px; }
            h1 { font-size: 32px; margin-bottom: 10px; }
            p.subtitle { font-size: 16px; }
            .video-player { margin-bottom: 0; }
            .timer-text { font-size: 18px; padding: 18px; margin-bottom: 20px; max-width: 400px; }
            
            .construction-view { max-width: 600px; padding: 60px 40px; }
            .construction-view h2 { font-size: 36px; }
            .construction-view p { font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- =========================================================
         AD VIEW (Initially Visible)
         ========================================================= -->
    <div class="content-box" id="ad-view">
        <button id="lang-toggle" class="lang-toggle">हिंदी</button>
        <div class="official-badge" data-i18n="official_page">Official App Page</div>

        <div class="content-grid">
            <!-- Left Column: App Info -->
            <div class="media-info">
                <div class="app-logo-wrap">
                    <img id="app-logo" src="https://placehold.co/200x200/14141F/E50914?text=RX+APP" alt="App Logo">
                </div>
                <h1 id="app-title">RX Player App</h1>
                <p class="subtitle">Experience the fastest & ad-free streaming!</p>
            </div>

            <!-- Right Column: Action Area -->
            <div class="action-area">
                
                <!-- TIMER -->
                <div id="timer-text" class="timer-text">
                    <i class="fas fa-clock"></i> <span id="timer-message">Please wait... 11 seconds</span>
                </div>

                <!-- VIDEO PLAYER (Dailymotion) - Added ID here -->
                <div class="video-player">
                    <iframe id="promo-video"
                        src="https://geo.dailymotion.com/player/x8lr5.html?video=xbr7cuy&autoplay=1&mute=1"
                        allow="autoplay; fullscreen; picture-in-picture"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen
                        frameborder="0">
                    </iframe>
                </div>

            </div>
        </div>
    </div>

    <!-- =========================================================
         UNDER CONSTRUCTION VIEW (Revealed after timer)
         ========================================================= -->
    <div class="construction-view" id="construction-view">
        <div class="app-logo-wrap" style="margin: 0 auto 20px; width: 80px; height: 80px; box-shadow: none;">
            <img src="https://placehold.co/200x200/14141F/E50914?text=RX+APP" alt="App Logo">
        </div>
        <div class="construction-icon"><i class="fas fa-tools"></i></div>
        <h2 data-i18n="under_construction">App Under Construction</h2>
        <p data-i18n="construction_msg">We are working hard to bring the ultimate streaming experience to your phone. Stay tuned!</p>
        <a href="https://t.me/rxplayer" target="_blank" class="notify-btn">
            <i class="fas fa-bell"></i> <span data-i18n="notify_me">Notify Me on Telegram</span>
        </a>
    </div>

    <script>
        /* =========================================================
           1. CONFIG & TRANSLATIONS
           ========================================================= */
        let currentLang = 'en';
        
        const translations = {
            en: {
                official_page: "Official App Page",
                timer_msg: "Please wait... {time} seconds",
                under_construction: "App Under Construction",
                construction_msg: "We are working hard to bring the ultimate streaming experience to your phone. Stay tuned!",
                notify_me: "Notify Me on Telegram"
            },
            hi: {
                official_page: "आधिकारिक ऐप पेज",
                timer_msg: "कृपया प्रतीक्षा करें... {time} सेकंड",
                under_construction: "ऐप निर्माणाधीन है",
                construction_msg: "हम आपके फोन पर शानदार स्ट्रीमिंग अनुभव लाने के लिए कड़ी मेहनत कर रहे हैं। बने रहें!",
                notify_me: "टेलीग्राम पर सूचित करें"
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });
            
            const toggleBtn = document.getElementById('lang-toggle');
            if(toggleBtn) toggleBtn.textContent = lang === 'en' ? 'हिंदी' : 'English';

            // Update timer text based on new language
            const timerMsg = document.getElementById('timer-message');
            if (timerMsg) {
                const m = timerMsg.textContent.match(/\d+/);
                const t = m ? m[0] : '11';
                timerMsg.textContent = translations[lang].timer_msg.replace('{time}', t);
            }
        }

        document.getElementById('lang-toggle').addEventListener('click', () => {
            setLanguage(currentLang === 'en' ? 'hi' : 'en');
        });

        // Initialize language
        setLanguage('en');

        /* =========================================================
           2. TIMER & TRANSITION LOGIC
           ========================================================= */
        (function () {
            const WAIT = 11;
            const msgEl = document.getElementById('timer-message');
            let timeLeft = WAIT;
            let started = false;

            function show(text) { if (msgEl) msgEl.textContent = text; }

            function tickText() {
                if (document.hidden) {
                    show(currentLang === 'hi'
                        ? 'टाइमर रुका है — इस टैब पर वापस आएं'
                        : 'Timer paused — return to this tab');
                } else {
                    show(translations[currentLang].timer_msg.replace('{time}', timeLeft));
                }
            }

            function revealConstructionView() {
                const adView = document.getElementById('ad-view');
                const constructionView = document.getElementById('construction-view');
                const videoIframe = document.getElementById('promo-video');

                // 🔥 STOP THE VIDEO: Iframe ka src hata dein taaki background me video na chale
                if (videoIframe) {
                    videoIframe.src = 'about:blank'; 
                }

                // Fade out ad view
                adView.style.opacity = '0';
                adView.style.transform = 'scale(0.95)';
                
                // After fade out, hide ad view and show construction view
                setTimeout(() => {
                    adView.style.display = 'none';
                    constructionView.classList.add('show');
                }, 500);
            }

            function startTimer() {
                tickText();
                setInterval(() => {
                    if (!started) return;
                    if (!document.hidden && timeLeft > 0) timeLeft--;
                    tickText();
                    if (timeLeft <= 0) {
                        started = false; // Stop timer
                        revealConstructionView(); // Show the coming soon screen
                    }
                }, 1000);
            }

            function init() {
                started = true;
                startTimer();
            }

            window.addEventListener('load', init);
        })();
    </script>

</body>
</html>
