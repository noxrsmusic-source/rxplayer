    <style>
        * {

        body {

        /* ===== NAVBAR ===== */
        .navbar {

        .nav-links a:hover { color: #e50914; }

        .nav-web-link {

        @media (max-width: 768px) { .nav-links { display: none; } }

        /* ===== MAIN LAYOUT ===== */

        /* ===== WATCH BANNER (New) ===== */

            display: flex;

            background: linear-gradient(90deg, #e50914, #b20710);

        }
        .watch-banner:hover {
            transform: translateY(-2px);

        }
        .watch-banner-content {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .watch-banner-content svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        @media (max-width: 480px) {
            .watch-banner-content { font-size: 14px; }
            .watch-banner-content svg { width: 20px; height: 20px; }

        /* ===== ARTICLE STYLING ===== */
        .article-content { max-width: 800px; margin: 0 auto; }

        .post-full-title {
            font-size: clamp(28px, 4vw, 42px); font-weight: 900; color: #ffffff;
            margin-bottom: 16px; line-height: 1.2; letter-spacing: -0.5px;
        }

        .post-full-meta-wrapper {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-wrap: wrap; gap: 15px;

        .post-full-meta {
            font-size: 13px; color: #9ca3af; font-weight: 600;
            text-transform: uppercase; display: flex; align-items: center; gap: 10px;

        /* Share Button */

        .post-full-body h3 { font-size: 20px; }

        .post-full-body ul, .post-full-body ol { margin: 20px 0 20px 24px; }
        .post-full-body li { margin-bottom: 10px; }

        .post-full-body blockquote {
            border-left: 4px solid #e50914; padding: 15px 20px; margin: 24px 0;
            background: rgba(229, 9, 20, 0.05); border-radius: 0 8px 8px 0;
            color: #d1d5db; font-style: italic; font-size: 17px;

        /* ===== SUGGESTED ARTICLES SECTION ===== */
        .suggested-section {
            max-width: 1000px; margin: 60px auto 0; padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .suggested-title {
            font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 24px;
            display: flex; align-items: center; gap: 10px;
        }
        .suggested-title::before {
            content: ''; width: 4px; height: 22px; background: #e50914; border-radius: 2px;
        }
        
        .suggested-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
        }

        .suggested-card {
            background: #111; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px;
            overflow: hidden; transition: all 0.3s ease; display: flex; flex-direction: column; text-decoration: none;
        }
        .suggested-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.6); border-color: rgba(229, 9, 20, 0.3); }
        .suggested-img-wrap { width: 100%; height: 160px; overflow: hidden; background: #1c1c1e; }
        .suggested-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
        .suggested-card:hover .suggested-img-wrap img { transform: scale(1.05); }
        .suggested-content { padding: 16px; display: flex; flex-direction: column; flex: 1; }
        .suggested-meta { color: #e50914; font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; }
        .suggested-card-title { font-size: 15px; font-weight: 800; line-height: 1.4; margin-bottom: 10px; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .suggested-card-snippet { font-size: 12px; color: #9ca3af; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }

        /* ===== FOOTER ===== */
        .footer { background: #0a0a0a; border-top: 1px solid rgba(255, 255, 255, 0.05); padding: 60px 5% 20px; margin-top: auto; }
        .footer-content { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; gap: 40px; }
        .footer-info { display: flex; align-items: center; gap: 16px; }

        .footer-text h4 { font-size: 18px; color: #fff; margin-bottom: 4px; }
        .footer-text p { font-size: 13px; color: #9ca3af; }
        .footer-actions { display: flex; flex-direction: column; gap: 20px; flex: 1; max-width: 400px; }
        .btn-get { background: #0088cc; color: #ffffff; border-radius: 12px; padding: 12px 24px; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.3s; }
        .btn-get:hover { background: #0077b3; }
        .btn-get svg { width: 18px; height: 18px; fill: currentColor; }
        .bottom-banner-ad-box { width: 100%; height: 60px; background: rgba(22, 22, 34, 0.85); border: 1px dashed rgba(255, 255, 255, 0.15); border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .footer-bottom { text-align: center; padding-top: 40px; margin-top: 40px; border-top: 1px solid rgba(255, 255, 255, 0.05); color: #6b7280; font-size: 13px; }

        /* Loading & Error States */
        #loading-text { text-align: center; color: #9ca3af; font-size: 16px; padding: 60px 20px; }
        .error-msg { text-align: center; color: #e50914; font-size: 16px; padding: 40px; background: rgba(229, 9, 20, 0.1); border-radius: 12px; }
    </style>
</head>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // Security
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCa-Ut8CCiZac7MPpeuw0LSjLehqLO4ICw",
            authDomain: "rxplayer-a2582.firebaseapp.com",
            databaseURL: "https://rxplayer-a2582-default-rtdb.firebaseio.com",
            projectId: "rxplayer-a2582",
            storageBucket: "rxplayer-a2582.firebasestorage.app",
            messagingSenderId: "208971977557",
            appId: "1:208971977557:web:501ee9138aa40dbef595dc",
            measurementId: "G-28GFZHBB6P"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Global variables for sharing
        let currentArticleTitle = '';
        let currentArticleImage = '';

        // Load Article Data
        async function loadArticle() {
            const container = document.getElementById('article-container');
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (!articleId) {
                container.innerHTML = '<div class="error-msg">Article ID not found in URL.</div>';
                return;
            }

            try {
                const doc = await db.collection('articles').doc(articleId).get();

                if (!doc.exists) {
                    container.innerHTML = '<div class="error-msg">Article does not exist or has been removed.</div>';
                    return;
                }

                const data = doc.data();
                currentArticleTitle = data.title || 'Untitled Article';
                currentArticleImage = data.image || 'https://res.cloudinary.com/du9nysbwl/image/upload/v1788457070/rxplayerlogo_ppyvfr.jpg';
                const content = data.content || '<p>No content available.</p>';
                const date = data.date ? new Date(data.date.toDate()).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : 'Recent';
                
                // --- Update SEO & Open Graph Meta Tags ---
                document.title = `${currentArticleTitle} - RX PLAYER`;
                
                // Strip HTML tags from content for description
                const tempDiv = document.createElement("div");
                tempDiv.innerHTML = content;
                const textSnippet = tempDiv.textContent || tempDiv.innerText || "";
                
                document.getElementById('og-title').setAttribute('content', currentArticleTitle);
                document.getElementById('og-desc').setAttribute('content', textSnippet.substring(0, 150) + '...');
                document.getElementById('og-image').setAttribute('content', currentArticleImage);
                document.getElementById('og-url').setAttribute('content', window.location.href);

                // --- Render HTML ---
                // Added the Watch Banner right before the article body
                container.innerHTML = `
                    <h1 class="post-full-title">${currentArticleTitle}</h1>
                    <div class="post-full-meta-wrapper">
                        <div class="post-full-meta">
                            <span>Published</span> • ${date}
                        </div>
                        <button class="share-btn" id="shareBtn">
                            <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                            Share
                        </button>
                    </div>

                    <!-- WATCH BANNER START -->
                    <a href="../dominpage.html" class="watch-banner">
                        <div class="watch-banner-content">
                            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            <span>Click Here to Watch Movies & Anime</span>
                        </div>
                    </a>
                    <!-- WATCH BANNER END -->

                    <div class="post-full-body" id="article-body">${content}</div>
                `;

                // --- Inject In-Article Ad dynamically ---
                injectInArticleAd();

                // --- Setup Share Button ---
                document.getElementById('shareBtn').addEventListener('click', shareArticle);

                // --- Load Suggested Articles ---
                loadSuggestedArticles(articleId);

            } catch (error) {
                console.error("Error fetching article: ", error);
                container.innerHTML = '<div class="error-msg">Failed to load the article. Please check your connection and try again.</div>';
            }
        }

        // --- Function to handle Native Share ---
        async function shareArticle() {
            const shareData = {
                title: currentArticleTitle,
                text: `Read this article on RX Player: ${currentArticleTitle}`,
                url: window.location.href
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    // Fallback for browsers that don't support native share
                    await navigator.clipboard.writeText(window.location.href);
                    alert("Link copied to clipboard! You can now paste it anywhere to share.");
                }
            } catch (err) {
                console.log('Error sharing:', err);
            }
        }

        // --- Function to inject Ad in the middle of the text ---
        function injectInArticleAd() {
            const body = document.getElementById('article-body');
            const paragraphs = body.querySelectorAll('p');
            
            // Agar article mein 2 se zyada paragraphs hain, toh 2nd paragraph ke baad ad daalo
            if (paragraphs.length > 1) {
                const adDiv = document.createElement('div');
                adDiv.className = 'ad-container in-article-ad';
                adDiv.innerHTML = `<span class="ad-tag">AD</span>`;
                
                const script1 = document.createElement('script');
                script1.type = 'text/javascript';
                script1.innerHTML = `atOptions = { 'key' : '4a5f21676e17448c3ce7697746d1287c', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };`;
                
                const script2 = document.createElement('script');
                script2.type = 'text/javascript';
                script2.src = 'https://www.highrevenueformat.com/4a5f21676e17448c3ce7697746d1287c/invoke.js';
                
                adDiv.appendChild(script1);
                adDiv.appendChild(script2);

                paragraphs[1].parentNode.insertBefore(adDiv, paragraphs[1].nextSibling);
            }
        }

        // --- Function to load other articles ---
        async function loadSuggestedArticles(currentId) {
            const suggestedContainer = document.getElementById('suggested-container');
            const suggestedGrid = document.getElementById('suggested-grid');

            try {
                const snapshot = await db.collection('articles').orderBy('date', 'desc').limit(4).get();
                
                if (snapshot.empty) return;

                let html = '';
                let count = 0;

                snapshot.forEach(doc => {
                    if (doc.id === currentId) return;
                    if (count >= 3) return; 
                    
                    const data = doc.data();
                    const title = data.title || 'Untitled';
                    const image = data.image || 'https://res.cloudinary.com/du9nysbwl/image/upload/v1788457070/rxplayerlogo_ppyvfr.jpg';
                    const date = data.date ? new Date(data.date.toDate()).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : 'Recent';
                    
                    const tempDiv = document.createElement("div");
                    tempDiv.innerHTML = data.content || '';
                    const textSnippet = tempDiv.textContent || tempDiv.innerText || "";
                    const snippet = textSnippet.substring(0, 80) + '...';

                    html += `
                        <a class="suggested-card" href="article.html?id=${doc.id}">
                            <div class="suggested-img-wrap">
                                <img src="${image}" alt="${title}" loading="lazy">
                            </div>
                            <div class="suggested-content">
                                <div class="suggested-meta">${date}</div>
                                <h3 class="suggested-card-title">${title}</h3>
                                <div class="suggested-card-snippet">${snippet}</div>
                            </div>
                        </a>
                    `;
                    count++;
                });

                if (html !== '') {
                    suggestedGrid.innerHTML = html;
                    suggestedContainer.style.display = 'block';
                }

            } catch (error) {
                console.error("Error fetching suggested articles: ", error);
            }
        }

        // Init
        loadArticle();
    </script>
