    <script>

        // Firebase Config

            apiKey: "AIzaSyCa-Ut8CCiZac7MPpeuw0LSjLehqLO4ICw",
            authDomain: "rxplayer-a2582.firebaseapp.com",
            databaseURL: "https://rxplayer-a2582-default-rtdb.firebaseio.com",
            projectId: "rxplayer-a2582",
            storageBucket: "rxplayer-a2582.firebasestorage.app",
            messagingSenderId: "208971977557",
            appId: "1:208971977557:web:501ee9138aa40dbef595dc",
            measurementId: "G-28GFZHBB6P"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Load Article Data
        async function loadArticle() {
            const container = document.getElementById('article-container');
            
            // Get ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (!articleId) {
                container.innerHTML = '<div class="error-msg">Article ID not found in URL.</div>';
                return;
            }

            try {
                const doc = await db.collection('articles').doc(articleId).get();

                if (!doc.exists) {
                    container.innerHTML = '<div class="error-msg">Article does not exist or has been removed.</div>';
                    return;
                }

                const data = doc.data();
                const title = data.title || 'Untitled Article';
                const content = data.content || '<p>No content available.</p>';
                const date = data.date ? new Date(data.date.toDate()).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : 'Recent';
                
                // Update Document Title & Meta for SEO
                document.title = `${title} - RX PLAYER`;
                const metaDesc = document.querySelector('meta[name="description"]');
                if(metaDesc) {
                    // Strip HTML tags from content for meta description
                    const tempDiv = document.createElement("div");
                    tempDiv.innerHTML = content;
                    const textSnippet = tempDiv.textContent || tempDiv.innerText || "";
                    metaDesc.setAttribute('content', textSnippet.substring(0, 150) + '...');
                }

                // Render HTML
                container.innerHTML = `
                    <h1 class="post-full-title">${title}</h1>
                    <div class="post-full-meta">
                        <span>Published</span> • ${date}
                    </div>
                    <div class="post-full-body">${content}</div>
                `;
            } catch (error) {
                console.error("Error fetching article: ", error);
                container.innerHTML = '<div class="error-msg">Failed to load the article. Please check your connection and try again.</div>';
            }
        }

        // Init
        loadArticle();
    </script>
