    <script>
        // Security
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || (e.ctrlKey && [85, 83].includes(e.keyCode))) {
                e.preventDefault();
            }
        });

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCa-Ut8CCiZac7MPpeuw0LSjLehqLO4ICw",
            authDomain: "rxplayer-a2582.firebaseapp.com",
            databaseURL: "https://rxplayer-a2582-default-rtdb.firebaseio.com",
            projectId: "rxplayer-a2582",
            storageBucket: "rxplayer-a2582.firebasestorage.app",
            messagingSenderId: "208971977557",
            appId: "1:208971977557:web:501ee9138aa40dbef595dc",
            measurementId: "G-28GFZHBB6P"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Background Posters
        const posters1 = ['https://m.media-amazon.com/images/M/MV5BMTk2ZmFhYjctYWZiYy00N2IxLWEzMWItZGRiMDY4ZDQwZWFlXkEyXkFqcGc@._V1_QL75_UY281_CR11,0,190,281_.jpg', 'https://m.media-amazon.com/images/M/MV5BNzdkNjAxNWMtNWY3My00NTI1LTg2YWQtOGI3MDA0NzdhMjEyXkEyXkFqcGc@._V1_QL75_UY281_CR12,0,190,281_.jpg', 'https://m.media-amazon.com/images/M/MV5BOWNjYWM3NWItOGE0ZS00MWRjLThiZWEtYjc4ZmNmMmU5ZTVmXkEyXkFqcGc@._V1_QL75_UX190_CR0,0,190,281_.jpg'];
        const posters2 = ['https://m.media-amazon.com/images/M/MV5BMjEzMDAxOTUyMV5BMl5BanBnXkFtZTgwNzAxMzYzOTE@._V1_QL75_UX190_CR0,0,190,281_.jpg', 'https://m.media-amazon.com/images/M/MV5BMGUzOWE4NDItNzAxYy00M2VkLWFiNDEtNjczZTQ2Nzg5YmVhXkEyXkFqcGc@._V1_QL75_UY281_CR18,0,190,281_.jpg', 'https://m.media-amazon.com/images/M/MV5BYmEzYTQ2OTEtMGM4MS00MWE1LWI3MGYtMTIyN2IwYzlkYmI0XkEyXkFqcGc@._V1_QL75_UY281_CR18,0,190,281_.jpg'];
        const posters3 = ['https://m.media-amazon.com/images/M/MV5BMWU1OGEwNmQtNGM3MS00YTYyLThmYmMtN2FjYzQzNzNmNTE0XkEyXkFqcGc@._V1_QL75_UX190_CR0,2,190,281_.jpg', 'https://m.media-amazon.com/images/M/MV5BZTNjOWI0ZTAtOGY1OS00ZGU0LWEyOWYtMjhkYjdlYmVjMDk2XkEyXkFqcGc@._V1_QL75_UY281_CR1,0,190,281_.jpg'];

        function createPosterHTML(url) { return `<div class="poster-card"><img src="${url}" alt="Poster" loading="lazy"></div>`; }
        function buildColumn(arr) { let html = ''; for(let i=0; i<4; i++) { arr.forEach(url => html += createPosterHTML(url)); } return html; }

        const bgWrapper = document.getElementById('backgroundWrapper');
        if(bgWrapper) {
            ['fast', 'slow', 'medium'].forEach((speed, index) => {
                const arr = [posters1, posters2, posters3][index];
                const col = document.createElement('div');
                col.className = `scroll-column scroll-column-up-${speed}`;
                col.innerHTML = buildColumn(arr);
                bgWrapper.appendChild(col);
            });
        }

        // Fetch Version Info
        async function fetchAppVersion() {
            try {
                const doc = await db.collection('config').doc('appVersion').get();
                if (doc.exists) {
                    const data = doc.data();
                    const version = data.version || '1.1.0';
                    document.getElementById('appVersionText').textContent = `v${version}`;
                    document.getElementById('downloadBtnLabel').textContent = `Download APK (v${version})`;
                }
            } catch (e) {}
        }

        // Fetch Articles
        async function fetchArticles() {
            const container = document.getElementById('articles-container');
            try {
                // Yahan humne collection ka naam 'articles' rakha hai (aap apne firebase ke hisaab se change kar sakte hain)
                const snapshot = await db.collection('articles').orderBy('date', 'desc').get();
                
                if (snapshot.empty) {
                    container.innerHTML = '<div style="color:#9ca3af; text-align:center; font-size:12px;">No articles published yet.</div>';
                    return;
                }

                let html = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const title = data.title || 'Untitled';
                    const image = data.image || 'https://res.cloudinary.com/du9nysbwl/image/upload/v1788457070/rxplayerlogo_ppyvfr.jpg'; // Default image
                    const date = data.date ? new Date(data.date.toDate()).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Recent';
                    
                    // Snippet nikalne ke liye HTML tags remove karna
                    const tempDiv = document.createElement("div");
                    tempDiv.innerHTML = data.content || '';
                    const textSnippet = tempDiv.textContent || tempDiv.innerText || "";
                    const snippet = textSnippet.substring(0, 100) + '...';

                    // Link article page par jayega with ID
                    const articleUrl = `articles/article.html?id=${doc.id}`;

                    html += `
                        <article class="post-card">
                            <a class="post-card-link" href="${articleUrl}">
                                <div class="post-card-image">
                                    <img src="${image}" alt="${title}">
                                </div>
                                <div class="post-card-content">
                                    <h3 class="post-card-title">${title}</h3>
                                    <div class="post-card-snippet">${snippet}</div>
                                    <div class="post-card-meta">${date}</div>
                                </div>
                            </a>
                        </article>
                    `;
                });

                container.innerHTML = html;
            } catch (error) {
                console.error("Error fetching articles: ", error);
                container.innerHTML = '<div style="color:#e50914; text-align:center; font-size:12px;">Failed to load articles.</div>';
            }
        }

        // Init
        fetchAppVersion();
        fetchArticles();
    </script>
