        /* 🎬 CINEMATIC BACKGROUND */

            gap: 12px;
            opacity: 0.12;
            z-index: 1;
            pointer-events: none;

        .scroll-column {

            gap: 12px;
            width: 25%;
            will-change: transform;
        }

        @media (min-width: 768px) { .scroll-column { width: 15%; } }

        @keyframes scrollUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(calc(-50% - 6px)); }
        }

        .col-1 { animation: scrollUp 40s linear infinite; }
        .col-2 { animation: scrollUp 50s linear infinite; }
        .col-3 { animation: scrollUp 45s linear infinite; }

        .poster-card {
            border-radius: 12px;

            aspect-ratio: 2 / 3;
            background: #1c1c1e;
            flex-shrink: 0;
        }
        .poster-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(5,5,5,0.6) 0%, #050505 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* 📱 DOWNLOAD CARD */
        .download-card {

            backdrop-filter: blur(20px);

        @keyframes cardIn {

            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .download-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, #e50914, transparent);
        }

            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .app-icon-wrapper::after {
            content: '';
            position: absolute;
            inset: -10px;
            background: radial-gradient(circle, rgba(229, 9, 20, 0.4) 0%, transparent 60%);
            z-index: -1;
            border-radius: 50%;

        .btn-download::after {

            top: -50%;
            left: -50%;
